<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Movie Database Picker (Dev)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444; /* Blood red accent for horror movies */
            --accent-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            color: #f87171;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d0606, #110202);
            border: 1px solid #7f1d1d;
            text-align: center;
            display: none;
        }

        .result-box h2 {
            margin: 0 0 10px 0;
            color: #f87171;
            font-size: 1.8rem;
        }

        .movie-meta {
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .status-msg {
            color: #f87171;
            font-style: italic;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* View Vault UI Styles */
        .toggle-vault-container {
            text-align: center;
            margin-top: 25px;
        }

        .toggle-vault-link {
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .toggle-vault-link:hover {
            color: var(--accent-color);
        }

        .vault-table-wrapper {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: none;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .vault-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        .vault-table th {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 12px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
        }

        .vault-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .vault-table tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🪓 The Horror Vault</h1>
    
    <div id="status" class="status-msg">Initializing database connection...</div>

    <div class="section">
        <label>Set Movie Filters</label>
        <div class="controls-grid">
            <div>
                <label for="decadeFilter">Decade</label>
                <select id="decadeFilter" disabled>
                    <option value="All">All Decades</option>
                </select>
            </div>
            <div>
                <label for="subgenreFilter">Subgenre</label>
                <select id="subgenreFilter" disabled>
                    <option value="All">All Subgenres</option>
                </select>
            </div>
            <div>
                <label for="guiltyFilter">Guilty Pleasure</label>
                <select id="guiltyFilter" disabled>
                    <option value="All">Show All</option>
                    <option value="yes">Only Guilty Pleasures</option>
                    <option value="no">Exclude Guilty Pleasures</option>
                </select>
            </div>
            <div>
                <label for="watchedFilter">Watched Status</label>
                <select id="watchedFilter" disabled>
                    <option value="All">Show All Movies</option>
                    <option value="unwatched">Only Unwatched</option>
                    <option value="watched">Only Watched</option>
                </select>
            </div>
            <div>
                <label for="triedFilter">Tried & True</label>
                <select id="triedFilter" disabled>
                    <option value="All">Show All</option>
                    <option value="yes">Only Tried & True</option>
                    <option value="no">Exclude Tried & True</option>
                </select>
            </div>
        </div>
    </div>

    <button id="pickBtn" disabled>Summon a Random Movie</button>

    <div id="result" class="result-box">
        <div style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 5px;">Your Fatal Match Is:</div>
        <h2 id="resultTitle">Movie Title</h2>
        <div id="resultMeta" class="movie-meta"></div>
    </div>

    <div class="toggle-vault-container">
        <span id="toggleVaultBtn" class="toggle-vault-link">👁️ View Full Horror Vault</span>
    </div>

    <div id="vaultTableWrapper" class="vault-table-wrapper">
        <table class="vault-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Subgenre</th>
                    <th>Year</th>
                    <th>Director</th>
                    <th>Watched?</th>
                </tr>
            </thead>
            <tbody id="vaultTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================
    // 🎛️ UPDATE THESE DETAILS FROM SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://rreqvdamizarmmxdwysd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZXF2ZGFtaXphcm1teGR3eXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDAyMjYsImV4cCI6MjA5NTExNjIyNn0.smuiGP-zcy7A9VwsPvOAi4DJ_TvYZF7rhQsoPQeYQjw";
    // ==========================================

    let supabaseClient = null;
    let moviesDataset = []; 
    let lastPickedMovieId = null;

    const statusDiv = document.getElementById('status');
    const decadeFilter = document.getElementById('decadeFilter');
    const subgenreFilter = document.getElementById('subgenreFilter');
    const guiltyFilter = document.getElementById('guiltyFilter');
    const watchedFilter = document.getElementById('watchedFilter');
    const triedFilter = document.getElementById('triedFilter');
    const pickBtn = document.getElementById('pickBtn');
    const resultBox = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');
    
    const toggleVaultBtn = document.getElementById('toggleVaultBtn');
    const vaultTableWrapper = document.getElementById('vaultTableWrapper');
    const vaultTableBody = document.getElementById('vaultTableBody');

    // Run connection setup on load
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            // Initialize database client connection wrapper
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            statusDiv.innerText = "Downloading entire horror vault...";
            
            await loadMovieVault();
        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ Database initialization failed. Check your console logs.";
        }
    });

    // Fetches all movies cleanly once to prevent server query syntax issues
    async function loadMovieVault() {
        const { data, error } = await supabaseClient
            .from('movies')
            .select('*');

        if (error) {
            statusDiv.innerText = "❌ Error reading 'movies' table. Verify table permissions.";
            console.error(error);
            return;
        }

        moviesDataset = data || [];
        statusDiv.innerText = `🩸 Linked seamlessly! Vault contains ${moviesDataset.length} horror films.`;

        // 1. DYNAMICALLY BUILD DECADE OPTIONS
        const decades = new Set();
        moviesDataset.forEach(item => {
            if (item.decade) decades.add(item.decade.trim());
        });
        decadeFilter.innerHTML = '<option value="All">All Decades</option>';
        Array.from(decades).sort().forEach(dec => {
            const opt = document.createElement('option');
            opt.value = dec; opt.innerText = dec; decadeFilter.appendChild(opt);
        });

        // 2. DYNAMICALLY BUILD SUBGENRE OPTIONS
        const subgenres = new Set();
        moviesDataset.forEach(item => {
            if (item.subgenre) subgenres.add(item.subgenre.trim());
        });
        subgenreFilter.innerHTML = '<option value="All">All Subgenres</option>';
        Array.from(subgenres).sort().forEach(sub => {
            const opt = document.createElement('option');
            opt.value = sub; opt.innerText = sub; subgenreFilter.appendChild(opt);
        });

        // Activate UI Dropdowns
        decadeFilter.disabled = false;
        subgenreFilter.disabled = false; 
        guiltyFilter.disabled = false;   
        watchedFilter.disabled = false;
        triedFilter.disabled = false;
        pickBtn.disabled = false;
    }

    // Pure JavaScript local calculation randomizer
    pickBtn.addEventListener('click', function() {
        const selDecade = decadeFilter.value;
        const selSubgenre = subgenreFilter.value; 
        const selGuilty = guiltyFilter.value;     
        const selWatched = watchedFilter.value;
        const selTried = triedFilter.value;

        const filteredMovies = moviesDataset.filter(movie => {
            if (selDecade !== 'All' && movie.decade !== selDecade) return false;

            if (selSubgenre !== 'All' && movie.subgenre !== selSubgenre) return false;

            if (selGuilty !== 'All') {
                const val = String(movie.guilty_pleasure || '').toLowerCase().trim();
                const isGuilty = (movie.guilty_pleasure === true || ['yes', 'true', 'x'].includes(val));
                if (selGuilty === 'yes' && !isGuilty) return false;
                if (selGuilty === 'no' && isGuilty) return false;
            }

            if (selWatched !== 'All') {
                const val = String(movie.watched || '').toLowerCase().trim();
                const isWatched = (movie.watched === true || ['yes', 'true', 'x', 'watched'].includes(val));
                if (selWatched === 'watched' && !isWatched) return false;
                if (selWatched === 'unwatched' && isWatched) return false;
            }

            if (selTried !== 'All') {
                const val = String(movie.triedandtrue || '').toLowerCase().trim();
                const isTried = (movie.triedandtrue === true || ['yes', 'true', 'x', 'tried and true'].includes(val));
                if (selTried === 'yes' && !isTried) return false;
                if (selTried === 'no' && isTried) return false;
            }

            return true;
        });

        if (filteredMovies.length === 0) {
            resultBox.style.display = 'block';
            resultTitle.innerText = "❌ No Match Found";
            resultMeta.innerHTML = "No films match this specific criteria. Try loosening your filters!";
            return;
        }

        let randomIndex;
        let selectedMovie;
        let attempts = 0;

        do {
            randomIndex = Math.floor(Math.random() * filteredMovies.length);
            selectedMovie = filteredMovies[randomIndex];
            attempts++;
        } while (selectedMovie.id === lastPickedMovieId && filteredMovies.length > 1 && attempts < 10);

        lastPickedMovieId = selectedMovie.id;

        resultBox.style.display = 'block';
        resultTitle.innerText = selectedMovie.title || "Untitled Nightmare";
        
        let metaHTML = '';
        if (selectedMovie.subgenre) metaHTML += `<strong>Subgenre:</strong> ${selectedMovie.subgenre}<br>`;
        if (selectedMovie.year) metaHTML += `<strong>Year:</strong> ${selectedMovie.year}<br>`;
        if (selectedMovie.director) metaHTML += `<strong>Director:</strong> ${selectedMovie.director}<br>`;
        if (selectedMovie.filmproductioncompany) metaHTML += `<strong>Studio:</strong> ${selectedMovie.filmproductioncompany}<br>`;
        
        let badges = [];
        const tVal = String(selectedMovie.triedandtrue || '').toLowerCase().trim();
        const wVal = String(selectedMovie.watched || '').toLowerCase().trim();
        const gVal = String(selectedMovie.guilty_pleasure || '').toLowerCase().trim();

        if (selectedMovie.triedandtrue === true || ['yes', 'true', 'x'].includes(tVal)) {
            badges.push('✨ Tried & True');
        }
        if (selectedMovie.guilty_pleasure === true || ['yes', 'true', 'x'].includes(gVal)) {
            badges.push('🍿 Guilty Pleasure');
        }
        if (selectedMovie.watched === true || ['yes', 'true', 'x'].includes(wVal)) {
            badges.push('✅ Watched');
        } else {
            badges.push('🩸 Unwatched');
        }
        
        metaHTML += `<div style="margin-top: 10px; font-style: italic; color: var(--text-muted);">${badges.join('  •  ')}</div>`;
        resultMeta.innerHTML = metaHTML;
    });

    // View Vault Click Event Handler Toggling 
    toggleVaultBtn.addEventListener('click', function() {
        if (vaultTableWrapper.style.display === 'block') {
            vaultTableWrapper.style.display = 'none';
            toggleVaultBtn.innerText = "👁️ View Full Horror Vault";
            return;
        }

        let tableHTML = '';
        moviesDataset.forEach(movie => {
            const isWatched = (movie.watched === true || ['yes', 'true', 'x'].includes(String(movie.watched || '').toLowerCase().trim()));
            const isTried = (movie.triedandtrue === true || ['yes', 'true', 'x'].includes(String(movie.triedandtrue || '').toLowerCase().trim()));
            const isGuilty = (movie.guilty_pleasure === true || ['yes', 'true', 'x'].includes(String(movie.guilty_pleasure || '').toLowerCase().trim()));
            
            let titleDisplay = movie.title;
            if (isTried) titleDisplay = `✨ <strong>${movie.title}</strong>`;
            if (isGuilty && !isTried) titleDisplay = `🍿 <em>${movie.title}</em>`;
            
            tableHTML += `
                <tr>
                    <td>${titleDisplay || 'Untitled'}</td>
                    <td>${movie.subgenre || '-'}</td>
                    <td>${movie.year || '-'}</td>
                    <td>${movie.director || '-'}</td>
                    <td>${isWatched ? '✅ Yes' : '🍿 No'}</td>
                </tr>
            `;
        });

        vaultTableBody.innerHTML = tableHTML;
        vaultTableWrapper.style.display = 'block';
        toggleVaultBtn.innerText = "🙈 Hide Full Horror Vault";
    });
</script>

</body>
</html>
