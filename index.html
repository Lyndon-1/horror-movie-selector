<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Movie Database Picker</title>
    <!-- Load the official Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444; /* Blood red accent for horror movies */
            --accent-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            color: #f87171;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d0606, #110202);
            border: 1px solid #7f1d1d;
            text-align: center;
            display: none;
        }

        .result-box h2 {
            margin: 0 0 10px 0;
            color: #f87171;
            font-size: 1.8rem;
        }

        .movie-meta {
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .status-msg {
            color: #f87171;
            font-style: italic;
            margin-bottom: 15px;
            font-weight: 500;
        }
        /* View Vault Link Styling */
        .toggle-vault-container {
            text-align: center;
            margin-top: 25px;
        }

        .toggle-vault-link {
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .toggle-vault-link:hover {
            color: var(--accent-color);
        }

        /* Responsive Vault Table Styling */
        .vault-table-wrapper {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto; /* Adds a scrollbar so it doesn't break page layout */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: none; /* Hidden by default */
            background-color: rgba(0, 0, 0, 0.2);
        }

        .vault-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        .vault-table th {
            background-color: rgba(239, 68, 68, 0.1); /* Slight horror red hue */
            color: #f87171;
            padding: 12px;
            position: sticky;
            top: 0; /* Keeps headers locked at the top while scrolling */
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
        }

        .vault-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .vault-table tr:hover {
            background-color: rgba(255, 255, 255, 0.03); /* Subtle row highlight */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🪓 The Horror Vault</h1>
    
    <div id="status" class="status-msg">Initializing database connection...</div>

    <!-- Parameter Filters -->
    <div class="section">
        <label>Set Movie Filters</label>
        <div class="controls-grid">
            <div>
                <label for="decadeFilter">Decade</label>
                <select id="decadeFilter" disabled>
                    <option value="All">All Decades</option>
                </select>
            </div>
            <div>
                <label for="watchedFilter">Watched Status</label>
                <select id="watchedFilter" disabled>
                    <option value="All">Show All Movies</option>
                    <option value="unwatched">Only Unwatched</option>
                    <option value="watched">Only Watched</option>
                </select>
            </div>
            <div>
                <label for="triedFilter">Tried & True</label>
                <select id="triedFilter" disabled>
                    <option value="All">Show All</option>
                    <option value="yes">Only Tried & True</option>
                    <option value="no">Exclude Tried & True</option>
                </select>
            </div>
        </div>
    </div>

    <button id="pickBtn" disabled>Summon a Random Movie</button>
    <!-- View/Hide Vault Action Interface -->
    <div class="toggle-vault-container">
        <span id="toggleVaultBtn" class="toggle-vault-link">👁️ View Full Horror Vault</span>
    </div>

    <!-- Scrollable Table Container -->
    <div id="vaultTableWrapper" class="vault-table-wrapper">
        <table class="vault-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Year</th>
                    <th>Director</th>
                    <th>Studio</th>
                    <th>Watched?</th>
                </tr>
            </thead>
            <tbody id="vaultTableBody">
                <!-- Rows will be dynamically injected here by JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Results Display -->
    <div id="result" class="result-box">
        <div style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 5px;">Your Fatal Match Is:</div>
        <h2 id="resultTitle">Movie Title</h2>
        <div id="resultMeta" class="movie-meta"></div>
    </div>
</div>

<script>
    // ==========================================

    const SUPABASE_URL = "https://rreqvdamizarmmxdwysd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZXF2ZGFtaXphcm1teGR3eXNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDAyMjYsImV4cCI6MjA5NTExNjIyNn0.smuiGP-zcy7A9VwsPvOAi4DJ_TvYZF7rhQsoPQeYQjw";
    // ==========================================

    let supabaseClient = null;
    let fullMovieCount = 0;

    const statusDiv = document.getElementById('status');
    const decadeFilter = document.getElementById('decadeFilter');
    const watchedFilter = document.getElementById('watchedFilter');
    const triedFilter = document.getElementById('triedFilter');
    const pickBtn = document.getElementById('pickBtn');
    const resultBox = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');

    // Run connection setup on load
    window.addEventListener('DOMContentLoaded', async () => {
        if (SUPABASE_URL.includes("YOUR_SUPABASE")) {
            statusDiv.innerHTML = "❌ Setup Required: Paste your Supabase keys on lines 132 & 133 of the HTML code.";
            return;
        }

        try {
            // Initialize the database client connection
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            await fetchFilterOptions();
        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ Database initialization failed. Check your keys or console logs.";
        }
    });

    // Smart data query: pulling available decades dynamically straight from the database
    async function fetchFilterOptions() {
        // Query distinct values by selecting just the decade column
        const { data, error, count } = await supabaseClient
            .from('movies')
            .select('decade', { count: 'exact' });

        if (error) {
            statusDiv.innerText = "❌ Error reading 'movies' table. Verify table name and permissions.";
            console.error(error);
            return;
        }

        fullMovieCount = count || data.length;
        statusDiv.innerText = `🩸 Linked seamlessly! Vault contains ${fullMovieCount} horror films.`;

        // Scrape unique values for dropdown layout setup
        const decades = new Set();
        data.forEach(item => {
            if (item.decade) decades.add(item.decade.trim());
        });

        decadeFilter.innerHTML = '<option value="All">All Decades</option>';
        Array.from(decades).sort().forEach(dec => {
            const opt = document.createElement('option');
            opt.value = dec;
            opt.innerText = dec;
            decadeFilter.appendChild(opt);
        });

        // Unlock input interfaces
        decadeFilter.disabled = false;
        watchedFilter.disabled = false;
        triedFilter.disabled = false;
        pickBtn.disabled = false;
    }

    // Database Filtering & Random selection mechanism
    pickBtn.addEventListener('click', async function() {
        pickBtn.disabled = true;
        pickBtn.innerText = "Summoning...";
        statusDiv.innerText = "Querying live backend records...";

        const selDecade = decadeFilter.value;
        const selWatched = watchedFilter.value;
        const selTried = triedFilter.value;

        // Build a precise server side data query filter based on UI selections
        let query = supabaseClient.from('movies').select('*');

        if (selDecade !== 'All') {
            query = query.eq('decade', selDecade);
        }

       // Dynamic status matching checks (Clean, standard boolean and text matching)
        if (selWatched !== 'All') {
            if (selWatched === 'watched') {
                // Looks for literal true boolean OR string match 'yes'
                query = query.or('watched.eq.true,watched.ilike.yes,watched.ilike.true,watched.ilike.x');
            } else {
                // Looks for false boolean, empty fields, or text 'no'
                query = query.or('watched.eq.false,watched.is.null,watched.ilike.no,watched.eq.');
            }
        }

        if (selTried !== 'All') {
            if (selTried === 'yes') {
                // Looks for literal true boolean OR string match 'yes' / 'tried and true'
                query = query.or('triedandtrue.eq.true,triedandtrue.ilike.yes,triedandtrue.ilike.true,triedandtrue.ilike.x,triedandtrue.ilike.tried and true');
            } else {
                // Looks for false boolean, empty fields, or text 'no'
                query = query.or('triedandtrue.eq.false,triedandtrue.is.null,triedandtrue.ilike.no,triedandtrue.eq.');
            }
        }

        // Execute query request across the web
        const { data: matchedMovies, error } = await query;

        // Re-enable button
        pickBtn.disabled = false;
        pickBtn.innerText = "Summon a Random Movie";
        statusDiv.innerText = `🩸 Connection active. Found ${matchedMovies ? matchedMovies.length : 0} matching entries.`;

        if (error || !matchedMovies || matchedMovies.length === 0) {
            resultBox.style.display = 'block';
            resultTitle.innerText = "❌ The Ritual Failed";
            resultMeta.innerHTML = "No films in your database match this specific horrific criteria. Try broadening your scope!";
            return;
        }

        // Grab a uniform random array row index
        const randomIndex = Math.floor(Math.random() * matchedMovies.length);
        const selectedMovie = matchedMovies[randomIndex];

        // Construct display meta tags safely safely mapping any empty rows to clean fallbacks
        resultBox.style.display = 'block';
        resultTitle.innerText = selectedMovie.title || "Untitled Nightmare";
        
        let metaHTML = '';
        if (selectedMovie.year) metaHTML += `<strong>Year:</strong> ${selectedMovie.year}<br>`;
        if (selectedMovie.director) metaHTML += `<strong>Director:</strong> ${selectedMovie.director}<br>`;
        if (selectedMovie.filmproductioncompany) metaHTML += `<strong>Studio:</strong> ${selectedMovie.filmproductioncompany}<br>`;
        
        let badges = [];
        const tVal = String(selectedMovie.triedandtrue || '').toLowerCase();
        const wVal = String(selectedMovie.watched || '').toLowerCase();

        if (['yes', 'true', 'x', 'tried and true'].includes(tVal)) {
            badges.push('✨ Tried & True Cult Classic');
        }
        if (['yes', 'true', 'x', 'watched'].includes(wVal)) {
            badges.push('✅ Survived (Watched)');
        } else {
            badges.push('🍿 Fresh Prey (Unwatched)');
        }
        
        metaHTML += `<div style="margin-top: 10px; font-style: italic; color: var(--text-muted);">${badges.join('  •  ')}</div>`;
        
        resultMeta.innerHTML = metaHTML;
    });
    let supabaseClient = null;
    let fullMovieCount = 0;
    let lastPickedMovieId = null;

    const statusDiv = document.getElementById('status');
    const decadeFilter = document.getElementById('decadeFilter');
    const watchedFilter = document.getElementById('watchedFilter');
    const triedFilter = document.getElementById('triedFilter');
    const pickBtn = document.getElementById('pickBtn');
    const resultBox = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');
    // Setup View Vault Table Variables
    const toggleVaultBtn = document.getElementById('toggleVaultBtn');
    const vaultTableWrapper = document.getElementById('vaultTableWrapper');
    const vaultTableBody = document.getElementById('vaultTableBody');

    // Click handler to toggle the viewport table display
    toggleVaultBtn.addEventListener('click', function() {
        // Checking state with direct style values or fallbacks
        if (vaultTableWrapper.style.display === 'block') {
            vaultTableWrapper.style.display = 'none';
            toggleVaultBtn.innerText = "👁️ View Full Horror Vault";

            alert("Database is still loading data rows. Please try again in a second!");
            return;
        }

        let tableHTML = '';
        
        moviesDataset.forEach(movie => {
            const isWatched = (movie.watched === true || ['yes', 'true', 'x'].includes(String(movie.watched || '').toLowerCase().trim()));
            const isTried = (movie.triedandtrue === true || ['yes', 'true', 'x'].includes(String(movie.triedandtrue || '').toLowerCase().trim()));
            
            const titleDisplay = isTried ? `✨ <strong>${movie.title}</strong>` : movie.title;
            
            tableHTML += `
                <tr>
                    <td>${titleDisplay || 'Untitled'}</td>
                    <td>${movie.year || '-'}</td>
                    <td>${movie.director || '-'}</td>
                    <td>${movie.filmproductioncompany || '-'}</td>
                    <td>${isWatched ? '✅ Yes' : '🍿 No'}</td>
                </tr>
            `;
        });

        vaultTableBody.innerHTML = tableHTML;
        vaultTableWrapper.style.display = 'block';
        toggleVaultBtn.innerText = "🙈 Hide Full Horror Vault";
    });
</script>

</body>
</html>
