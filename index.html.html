<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Offline Movie Picker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            border: 1px solid #4338ca;
            text-align: center;
            display: none;
        }

        .result-box h2 {
            margin: 0 0 10px 0;
            color: #f43f5e;
            font-size: 1.8rem;
        }

        .movie-meta {
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .status-msg {
            color: #34d399;
            font-style: italic;
            margin-top: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍿 Personal Movie Picker</h1>
    
    <!-- Step 1: Paste Box (Replaces the broken network feature) -->
    <div class="section">
        <label for="csvPaste">1. Paste Spreadsheet Rows Here</label>
        <textarea id="csvPaste" placeholder="Step 1: In Google Sheets, copy your cells (including headers) and paste them here..."></textarea>
        <div id="status" class="status-msg">Waiting for data...</div>
    </div>

    <!-- Step 2: Filters -->
    <div class="section">
        <label>2. Set Movie Filters</label>
        <div class="controls-grid">
            <div>
                <label for="decadeFilter">Decade</label>
                <select id="decadeFilter" disabled>
                    <option value="All">All Decades</option>
                </select>
            </div>
            <div>
                <label for="watchedFilter">Watched Status</label>
                <select id="watchedFilter" disabled>
                    <option value="All">Show All Movies</option>
                    <option value="unwatched">Only Unwatched</option>
                    <option value="watched">Only Watched</option>
                </select>
            </div>
            <div>
                <label for="triedFilter">Tried & True</label>
                <select id="triedFilter" disabled>
                    <option value="All">Show All</option>
                    <option value="yes">Only Tried & True</option>
                    <option value="no">Exclude Tried & True</option>
                </select>
            </div>
        </div>
    </div>

    <button id="pickBtn" disabled>Pick a Random Movie</button>

    <!-- Results Display -->
    <div id="result" class="result-box">
        <div style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 5px;">Your Match Is:</div>
        <h2 id="resultTitle">Movie Title</h2>
        <div id="resultMeta" class="movie-meta"></div>
    </div>
</div>

<script>
    let moviesDataset = [];
    let headers = [];

    const pasteArea = document.getElementById('csvPaste');
    const statusDiv = document.getElementById('status');
    const decadeFilter = document.getElementById('decadeFilter');
    const watchedFilter = document.getElementById('watchedFilter');
    const triedFilter = document.getElementById('triedFilter');
    const pickBtn = document.getElementById('pickBtn');
    const resultBox = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');

    // Automatically processes data the second you paste it in
    pasteArea.addEventListener('input', function() {
        const rawText = pasteArea.value.trim();
        if (!rawText) {
            statusDiv.innerText = "Waiting for data...";
            disableControls();
            return;
        }
        parseData(rawText);
    });

    function parseData(text) {
        // Splits by rows (handles both standard CSVs or Direct copy-pastes from Google Sheets tabs)
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) {
            statusDiv.innerText = "❌ Missing data rows. Make sure you copy the headers too!";
            return;
        }

        // Detect if user copied directly from Google Sheets (Tabs) or a downloaded CSV (Commas)
        const delimiter = lines[0].includes('\t') ? '\t' : ',';

        // Clean headers
        headers = splitLine(lines[0], delimiter).map(h => h.trim().toLowerCase().replace(/[\s_]/g, ''));
        moviesDataset = [];

        for (let i = 1; i < lines.length; i++) {
            const values = splitLine(lines[i], delimiter);
            if (values.length !== headers.length) continue; 

            let movie = {};
            headers.forEach((header, index) => {
                movie[header] = values[index].trim();
            });
            moviesDataset.push(movie);
        }

        statusDiv.innerText = `✅ Successfully read ${moviesDataset.length} movies! Filters are now updated.`;
        populateDecadeDropdown();
        enableControls();
    }

    function splitLine(line, delimiter) {
        if (delimiter === '\t') return line.split('\t'); // Clean tab split for sheet copies
        
        let result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"' || char === "'") {
                inQuotes = !inQuotes;
            } else if (char === delimiter && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    function populateDecadeDropdown() {
        if (!headers.includes('decade')) return;

        const decades = new Set();
        moviesDataset.forEach(movie => {
            if (movie['decade']) decades.add(movie['decade']);
        });

        decadeFilter.innerHTML = '<option value="All">All Decades</option>';
        Array.from(decades).sort().forEach(dec => {
            const opt = document.createElement('option');
            opt.value = dec;
            opt.innerText = dec;
            decadeFilter.appendChild(opt);
        });
    }

    function enableControls() {
        decadeFilter.disabled = false;
        watchedFilter.disabled = false;
        triedFilter.disabled = false;
        pickBtn.disabled = false;
    }

    function disableControls() {
        decadeFilter.disabled = true;
        watchedFilter.disabled = true;
        triedFilter.disabled = true;
        pickBtn.disabled = true;
    }

    pickBtn.addEventListener('click', function() {
        const selDecade = decadeFilter.value;
        const selWatched = watchedFilter.value;
        const selTried = triedFilter.value;

        const filteredMovies = moviesDataset.filter(movie => {
            if (selDecade !== 'All' && movie['decade'] !== selDecade) return false;

            if (selWatched !== 'All') {
                const wValue = (movie['watched'] || '').toLowerCase();
                const isWatched = ['yes', 'true', 'x', 'watched'].includes(wValue);
                if (selWatched === 'watched' && !isWatched) return false;
                if (selWatched === 'unwatched' && isWatched) return false;
            }

            if (selTried !== 'All') {
                const tValue = (movie['triedandtrue'] || '').toLowerCase();
                const isTried = ['yes', 'true', 'x', 'tried and true'].includes(tValue);
                if (selTried === 'yes' && !isTried) return false;
                if (selTried === 'no' && isTried) return false;
            }

            return true;
        });

        if (filteredMovies.length === 0) {
            resultBox.style.display = 'block';
            resultTitle.innerText = "❌ No Match Found";
            resultMeta.innerHTML = "No movies match this exact combination of filters. Try loosening your selections!";
            return;
        }

        const randomIndex = Math.floor(Math.random() * filteredMovies.length);
        const selectedMovie = filteredMovies[randomIndex];

        resultBox.style.display = 'block';
        resultTitle.innerText = selectedMovie['title'] || "Untitled Film";
        
        let metaHTML = '';
        if (selectedMovie['year']) metaHTML += `<strong>Year:</strong> ${selectedMovie['year']}<br>`;
        if (selectedMovie['director']) metaHTML += `<strong>Director:</strong> ${selectedMovie['director']}<br>`;
        if (selectedMovie['filmproductioncompany']) metaHTML += `<strong>Production:</strong> ${selectedMovie['filmproductioncompany']}<br>`;
        
        let badges = [];
        if (selectedMovie['triedandtrue'] && ['yes','true','x'].includes(selectedMovie['triedandtrue'].toLowerCase())) {
            badges.push('✨ Tried & True');
        }
        if (selectedMovie['watched'] && ['yes','true','x'].includes(selectedMovie['watched'].toLowerCase())) {
            badges.push('✅ Watched');
        } else {
            badges.push('🍿 Unwatched');
        }
        
        metaHTML += `<div style="margin-top: 10px; font-style: italic; color: var(--text-muted);">${badges.join('  •  ')}</div>`;
        
        resultMeta.innerHTML = metaHTML;
    });
</script>

</body>
</html>
